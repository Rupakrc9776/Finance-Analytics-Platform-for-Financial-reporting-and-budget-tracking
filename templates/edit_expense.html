{% extends "base.html" %}

{% block title %}
Edit Expense | Smart Finance Insights
{% endblock %}

{% block content %}

<h1 class="page-heading">
    Edit Expense
</h1>

<div class="fade">
    <div class="form-card">
        <h2>Update Expense</h2>

        <form action="/edit_expense/{{ expense['id'] }}" method="POST">

            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

            <div class="form-group">
                <label>Category</label>
                <select name="category" required>
                    <option value="">Select Category</option>
                    <option value="Food" {% if expense['category'] == 'Food' %}selected{% endif %}>Food</option>
                    <option value="Travel" {% if expense['category'] == 'Travel' %}selected{% endif %}>Travel</option>
                    <option value="Shopping" {% if expense['category'] == 'Shopping' %}selected{% endif %}>Shopping</option>
                    <option value="Education" {% if expense['category'] == 'Education' %}selected{% endif %}>Education</option>
                    <option value="Bills" {% if expense['category'] == 'Bills' %}selected{% endif %}>Bills</option>
                    <option value="Medical" {% if expense['category'] == 'Medical' %}selected{% endif %}>Medical</option>
                    <option value="Entertainment" {% if expense['category'] == 'Entertainment' %}selected{% endif %}>Entertainment</option>
                    <option value="Others" {% if expense['category'] == 'Others' %}selected{% endif %}>Others</option>
                </select>
            </div>

            <div class="form-group">
                <label>Amount</label>
                <input type="number" name="amount" value="{{ expense['amount'] }}" required>
            </div>

            <div class="form-group">
                <label>Description</label>
                <textarea rows="4" name="description">{{ expense['description'] }}</textarea>
            </div>

            <div class="form-group">
                <label>Expense Date</label>
                <input type="date" name="expense_date" value="{{ expense['expense_date'] }}" required>
            </div>

            <button class="btn btn-primary" type="submit">
                <i class="fa-solid fa-save"></i>
                Update Expense
            </button>
        </form>
    </div>
</div>

{% endblock %}
