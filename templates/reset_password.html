<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Reset Password | Smart Finance Insights</title>

    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

</head>

<body class="auth-page">

    <div class="auth-card fade">

        <h1>
            <i class="fa-solid fa-lock"></i>
            Set New Password
        </h1>

        <p>Create a strong new password for your account.</p>

        {% with messages = get_flashed_messages(with_categories=true) %}
        {% if messages %}
        {% for category, message in messages %}
        <div class="flash-message {{ category }}">{{ message }}</div>
        {% endfor %}
        {% endif %}
        {% endwith %}

        <form action="/reset_password" method="POST" onsubmit="return validateResetForm()">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

            <div class="form-group">
                <label>New Password</label>
                <div class="password-box">
                    <input type="password" id="resetPassword" name="new_password" placeholder="New Password" required>
                    <i class="fa-solid fa-eye" id="toggleResetPassword"></i>
                </div>
            </div>

            <div class="form-group">
                <label>Confirm Password</label>
                <div class="password-box">
                    <input type="password" id="confirmResetPassword" name="confirm_password" placeholder="Confirm Password" required>
                    <i class="fa-solid fa-eye" id="toggleConfirmReset"></i>
                </div>
            </div>

            <div class="password-strength">
                <div class="password-strength-bar" id="resetStrengthBar"></div>
            </div>
            <p class="password-strength-text" id="resetStrengthText">Use a strong password.</p>

            <button type="submit" class="btn btn-primary">Reset Password</button>
        </form>

    </div>

    <script>
        function togglePassword(inputId, iconId) {
            const input = document.getElementById(inputId);
            const icon = document.getElementById(iconId);
            if (input.type === 'password') {
                input.type = 'text';
                icon.classList.remove('fa-eye');
                icon.classList.add('fa-eye-slash');
            } else {
                input.type = 'password';
                icon.classList.remove('fa-eye-slash');
                icon.classList.add('fa-eye');
            }
        }

        document.getElementById('toggleResetPassword').addEventListener('click', function () {
            togglePassword('resetPassword', 'toggleResetPassword');
        });

        document.getElementById('toggleConfirmReset').addEventListener('click', function () {
            togglePassword('confirmResetPassword', 'toggleConfirmReset');
        });

        const resetPasswordField = document.getElementById('resetPassword');
        const resetStrengthBar = document.getElementById('resetStrengthBar');
        const resetStrengthText = document.getElementById('resetStrengthText');

        resetPasswordField.addEventListener('input', function () {
            const value = this.value;
            let score = 0;
            if (value.length >= 8) score += 25;
            if (/[A-Z]/.test(value)) score += 25;
            if (/[a-z]/.test(value)) score += 20;
            if (/[0-9]/.test(value)) score += 15;
            if (/[^A-Za-z0-9]/.test(value)) score += 15;
            resetStrengthBar.style.width = score + '%';
            if (score < 40) {
                resetStrengthBar.style.background = 'var(--danger)';
                resetStrengthText.textContent = 'Weak password';
            } else if (score < 80) {
                resetStrengthBar.style.background = 'var(--warning)';
                resetStrengthText.textContent = 'Moderate password';
            } else {
                resetStrengthBar.style.background = 'var(--success)';
                resetStrengthText.textContent = 'Strong password';
            }
        });

        function validateResetForm() {
            const password = document.getElementById('resetPassword').value;
            const confirm = document.getElementById('confirmResetPassword').value;
            if (password !== confirm) {
                alert('Passwords do not match!');
                return false;
            }
            if (password.length < 8) {
                alert('Password must be at least 8 characters long.');
                return false;
            }
            return true;
        }
    </script>

</body>

</html>
