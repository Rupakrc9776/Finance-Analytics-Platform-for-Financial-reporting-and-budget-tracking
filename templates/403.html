<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Access Denied | Smart Finance Insights</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
</head>

<body class="auth-page">

    <div class="auth-card fade auth-status-card error" role="alert" aria-live="polite">
        <div class="auth-status-icon error">
            <i class="fa-solid fa-shield-halved"></i>
        </div>

        <h1>Access Denied</h1>
        <p>This section is restricted to the developer account.</p>
        <p>You do not have permission to access this resource.</p>

        {% if session.get('user_id') %}
        <a href="{{ url_for('dashboard') }}" class="btn btn-primary">Return to Dashboard</a>
        {% else %}
        <a href="{{ url_for('login') }}" class="btn btn-primary">Go to Login</a>
        {% endif %}
    </div>

</body>

</html>
